  <title>Louis Valderrrama</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;

      place-items: center;
      padding: 2rem;
      background: #f5f7fa;
      color: #172b4d;
      font-family: system-ui, sans-serif;

    main {
      width: 100%;
      max-width: 42rem;

      border-radius: 0.5rem;

      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
